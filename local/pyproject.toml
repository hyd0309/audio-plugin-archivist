[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "audio-plugin-archivist"
version = "0.1.0"
description = "Local audio effect manual archive and selection assistant"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "python-multipart>=0.0.20", "pymupdf>=1.25,<2", "pydantic>=2.10,<3", "httpx>=0.28,<1", "python-dotenv>=1,<2", "filelock>=3.18,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
audio-archive = "audio_archive.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
